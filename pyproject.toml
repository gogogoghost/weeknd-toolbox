[project]
name = "flip"
version = "0.1.0"
description = "Build, flash and back up custom Linux for the Nokia 2780 Flip"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "typer>=0.12",
]

[project.scripts]
flip = "flip.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
