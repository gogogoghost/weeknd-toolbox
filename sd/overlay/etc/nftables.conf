#!/usr/sbin/nft -f
# Nothing on the phone accepts incoming connections. Administration happens only
# over the USB cable (flipd), which isn't a network interface.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		# IPv6 needs these to work at all (neighbour discovery, router adverts)
		meta l4proto ipv6-icmp icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big, destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		# DHCP replies
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
